<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter | Task 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="converter-card">
        <h1>Temperature Converter</h1>
        <p class="subtitle">Enter a degree value, pick your unit, and click the convert button.</p>

        <!-- Form retains onsubmit handler with event passing -->
        <form id="converter-form" onsubmit="convertTemperature(event)">
            
            <div class="input-group">
                <label for="degrees">Degrees:</label>
                <input type="number" id="degrees" step="any" placeholder="Enter degrees" required>
            </div>

            <div class="input-group">
                <label for="unit">Unit:</label>
                <select id="unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <button type="submit" id="convert-btn" onclick="convertTemperature(event)">Convert</button>
        </form>

        <div id="result-box" class="result-box hidden">
            <h2>Converted Values</h2>
            <div id="output-list" class="output-list"></div>
        </div>

        <div id="error-box" class="error-box hidden"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
